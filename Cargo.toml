[package]
name = "blokus"
version = "2.2.0"
edition = "2024"
description = "Blokus board game — Rust rewrite with a stronger AI"

[dependencies]
macroquad = { version = "0.4.15", features = ["audio"] }

[lib]
name = "blokus"
path = "src/lib.rs"

[[bin]]
name = "blokus"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
